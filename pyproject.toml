# PyPI distribution name: `neptune-trident`
# (the bare name `neptune` is taken on PyPI by neptune.ai's ML client).
# The Python *import* name remains `neptune` — i.e. users do
#     pip install neptune-trident
#     python -c "import neptune"
# Change `[project].name` below if you want a different PyPI distribution name.

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neptune-trident"
version = "0.2.0"
description = "Neutrino trident (coherent, diffractive, resonant, DIS, and electron-target) and nu-e elastic cross sections and event generation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Matheus Hostert", email = "matheus-hostert@uiowa.edu" },
]
keywords = ["neutrino", "trident", "BSM", "Z-prime", "Monte Carlo", "particle physics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.0",      # np.trapezoid
    "scipy>=1.10",
    "vegas>=6.0",      # Integrator(ran_array_generator=...)
    "pandas>=1.5",
    "DarkNews>=0.4.8",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
    "nbclient",
    "nbformat",
    "matplotlib",
    "build",
    "twine",
]
# DIS-trident with LHAPDF-backed structure functions. Install the LHAPDF
# Python bindings separately (for example from conda-forge), then fetch grids:
#   lhapdf-management update --init
#   lhapdf-management install CT18NLO
dis = [
    "lhapdf-management",
]

[project.urls]
Homepage = "https://github.com/mhostert/neptune"
Repository = "https://github.com/mhostert/neptune"
Issues = "https://github.com/mhostert/neptune/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neptune*"]

[tool.setuptools.package-data]
neptune = ["data/matrixelements/*.dat"]
